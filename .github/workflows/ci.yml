name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts

      - run: npm test --prefix packages/autotour-runtime
      - run: npm pack ./packages/autotour-runtime --dry-run --ignore-scripts
      - run: npm pack ./packages/webtour-compat --dry-run --ignore-scripts
