name: Branch policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  require-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Pull requests into main must come from develop."
            exit 1
          fi
